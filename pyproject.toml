[project]
name = "playmaker-cli"
version = "0.11.0"
description = "Playing-coach CLI for orchestrating Claude Code, Codex, Antigravity, Kimi Code and opencode sub-agents in parallel."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vladislav Shulyugin", email = "vladislav.shulyugin@gmail.com" },
]
keywords = [
    "ai",
    "agents",
    "orchestration",
    "cli",
    "claude",
    "claude-code",
    "codex",
    "antigravity",
    "gemini",
    "kimi",
    "kimi-code",
    "opencode",
    "glm",
    "subagents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.27.0",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/vladsafedev/playmaker"
Repository = "https://github.com/vladsafedev/playmaker"
Issues = "https://github.com/vladsafedev/playmaker/issues"

[project.scripts]
playmaker = "playmaker.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playmaker"]

# The coach skill lives at skills/ for discoverability on GitHub; ship it inside
# the package so `playmaker skill install` works from a pip/uv install too.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "playmaker/_skills"

[tool.hatch.build.targets.sdist]
include = [
    "src/playmaker",
    "skills",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Typer's whole API is `param: T = typer.Option(...)`, which B008 flags by design.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
