[project]
name = "team"
version = "0.1.0"
description = "Multi-agent orchestration CLI: facade for Claude Code to dispatch and observe Codex/Gemini subtasks"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
team = "team.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/team"]

[tool.ruff]
line-length = 100
target-version = "py311"
